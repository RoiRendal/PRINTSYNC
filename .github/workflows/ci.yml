name: CI

# Runs on every push and every pull request. There was previously no pipeline at
# all, which is how the frontend accumulated 16 type errors without anyone
# noticing — Vite strips types without checking them, so a broken build still
# deployed. The point of this file is that those cannot come back.

on:
  push:
  pull_request:

# A new push supersedes an in-flight run on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shared-types:
    name: shared-types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/shared-types/package-lock.json

      - name: Install
        run: npm ci
        working-directory: packages/shared-types

      - name: Type-check
        run: npm run lint
        working-directory: packages/shared-types

      - name: Build
        run: npm run build
        working-directory: packages/shared-types

      # The backend resolves `@printsync/shared-types` to this compiled output,
      # so it has to be produced before the backend can be type-checked. The
      # frontend does not need it — it maps the package to `src/index.ts`.
      - name: Upload compiled contracts
        uses: actions/upload-artifact@v4
        with:
          name: shared-types-dist
          path: packages/shared-types/dist
          retention-days: 1

  backend:
    name: backend
    runs-on: ubuntu-latest
    needs: shared-types
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Fetch compiled contracts
        uses: actions/download-artifact@v4
        with:
          name: shared-types-dist
          path: packages/shared-types/dist

      - name: Install
        run: npm ci
        working-directory: backend

      - name: Type-check
        run: npm run lint
        working-directory: backend

      - name: Type-check tests
        run: npm run lint:tests
        working-directory: backend

      # `test:integration` is deliberately excluded: it drives the real API and
      # needs live Supabase credentials, which must not be handed to CI.
      - name: Unit tests
        run: npm run test:unit
        working-directory: backend

      - name: Build
        run: npm run build
        working-directory: backend

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci
        working-directory: frontend

      # This is the gate that did not exist before. `npm run build` alone would
      # pass with type errors, because Vite transpiles without checking.
      - name: Type-check
        run: npm run lint
        working-directory: frontend

      # The suite covers the parts that fail silently rather than loudly: the
      # store freshness rules, the idempotency-key lifetime that decides whether
      # a retry double-charges, the structured-error contract, and the realtime
      # heartbeat. None of those produce a visible error when they break — the
      # screen just quietly goes stale, or a customer is charged twice.
      - name: Unit tests
        run: npm test
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
